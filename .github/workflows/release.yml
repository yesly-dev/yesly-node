# Publishes to npm when a tag such as v0.1.0 is pushed. Uses npm trusted
# publishing (OIDC), so no token is stored: see docs/publishing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm publish
